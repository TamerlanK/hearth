name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: coverage summary
        shell: bash
        run: |
          echo '### Coverage (${{ matrix.os }}, go ${{ matrix.go }})' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-go-${{ matrix.go }}
          path: coverage.out

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make fuzz

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: cross-compile
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              [ "$os" = windows ] && ext=.exe
              echo "building $os/$arch"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -o "dist/hearth-$os-$arch$ext" ./cmd/hearth
            done
          done
          ls -l dist/

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t hearth:ci --build-arg VERSION=ci --build-arg COMMIT=${GITHUB_SHA::7} .
      - name: run hearth version inside the image
        run: docker run --rm hearth:ci version
