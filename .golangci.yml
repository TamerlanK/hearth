version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - noctx
    - prealloc
    - revive
    - staticcheck
    - unused

  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: package-comments
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      settings:
        hugeParam:
          sizeThreshold: 160
        rangeValCopy:
          sizeThreshold: 160

  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - prealloc
      - path: ^(internal|cmd)/|_test\.go$
        linters:
          - revive
        text: ^(exported|package-comments)
      - linters:
          - gocritic
        text: ^hugeParam
        source: slog\.Record\) error

formatters:
  enable:
    - gofmt
    - goimports
